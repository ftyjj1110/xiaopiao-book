<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f5ef">
<title>购物小票管家 V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#fff;padding:18px 16px;border-bottom:1px solid #eee}header h1{font-size:21px;margin:0 0 5px}header p,.muted{font-size:12px;color:#888}
nav{display:flex;overflow:auto;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:3}
nav button{border:0;background:none;padding:13px 14px;white-space:nowrap;color:#777}nav button.active{color:#287c65;border-bottom:3px solid #287c65}
main{padding:14px;max-width:760px;margin:auto}.page{display:none}.page.active{display:block}.card{background:white;border-radius:14px;padding:15px;margin-bottom:13px;box-shadow:0 2px 8px #00000008}
h2{font-size:18px}h3{font-size:15px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f0f7f3;padding:13px;border-radius:10px}.stat strong{display:block;color:#287c65;font-size:21px;margin-top:7px}
button.primary{background:#287c65;color:white;border:0;border-radius:9px;padding:11px 15px}button.secondary{background:#edf5f1;color:#287c65;border:0;border-radius:9px;padding:10px 13px}button.danger{background:#fff0ef;color:#b44;border:0;border-radius:8px;padding:8px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;background:white;font-size:14px;margin:5px 0 12px}label{font-size:13px;color:#666}
.row,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:0}.item{padding:12px 0;border-bottom:1px solid #eee}.itemtop{display:flex;justify-content:space-between;gap:8px}.amount{color:#287c65;font-weight:bold}.empty{text-align:center;color:#aaa;padding:25px}
.receipt-img{width:100%;max-height:220px;object-fit:contain;margin-top:10px}.product-row{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:5px;margin:7px 0}.product-row input,.product-row select{margin:0;padding:8px;font-size:12px}.product-row button{border:0;background:#fff0ef;color:#b44;border-radius:6px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;overflow:auto;padding:15px}.modal.show{display:block}.modalbox{background:white;border-radius:14px;padding:16px;max-width:600px;margin:20px auto}
@media(max-width:430px){.product-row{grid-template-columns:1.2fr 1fr .8fr auto}.product-row input,.product-row select{font-size:11px;padding:7px}}
@media print{nav,button,input,select,textarea{display:none!important}body{background:white}.card{box-shadow:none}}
</style>
</head>
<body>
<header><h1>🧾 购物小票管家</h1><p>山姆 · 开市客 · 商品明细与消费记录</p></header>
<nav>
<button class="active" onclick="showPage('home',this)">首页</button><button onclick="showPage('add',this)">添加小票</button><button onclick="showPage('bills',this)">全部账单</button><button onclick="showPage('stats',this)">分类统计</button><button onclick="showPage('shops',this)">商店</button><button onclick="showPage('settings',this)">设置</button>
</nav>
<main>
<section id="home" class="page active"><h2>消费总览</h2><div class="stats">
<div class="stat">今日消费<strong id="todayTotal">£0.00</strong></div><div class="stat">本月消费<strong id="monthTotal">£0.00</strong></div><div class="stat">本年消费<strong id="yearTotal">£0.00</strong></div><div class="stat">小票数量<strong id="receiptCount">0</strong></div></div>
<div class="card"><h3>最近小票</h3><div id="recentList" class="empty">还没有记录</div></div></section>
<section id="add" class="page"><h2>添加购物小票</h2><div class="card">
<label>商店</label><select id="store"><option>山姆</option><option>开市客</option></select>
<label>购物日期</label><input type="date" id="receiptDate">
<label>小票照片（可从相册选择或拍照）</label><input type="file" id="photoInput" accept="image/*">
<img id="preview" class="receipt-img" style="display:none">
<div class="actions"><button class="primary" onclick="recognizeReceipt()">识别小票</button><button class="secondary" onclick="clearPhoto()">清除照片</button></div><p id="ocrStatus" class="muted">选择照片后可尝试自动识别。</p></div>
<div class="card"><h3>商品明细</h3><p class="muted">商品逐项填写，识别后请核对名称和金额。</p><div id="productList"></div><button class="secondary" onclick="addProductRow()">＋ 添加商品</button><hr>
<label>小票总金额</label><input type="number" id="receiptTotal" step="0.01" placeholder="小票总金额"><p id="sumHint" class="muted">商品金额合计：£0.00</p>
<label>备注</label><textarea id="receiptNote" rows="2"></textarea><button class="primary" onclick="saveReceipt()">保存这张小票</button><button class="secondary" onclick="resetForm()">清空</button></div></section>
<section id="bills" class="page"><h2>全部账单</h2><div class="card"><div class="row"><select id="billStore" onchange="renderBills()"><option value="">全部商店</option><option>山姆</option><option>开市客</option></select><select id="billYear" onchange="renderBills()"><option value="">全部年份</option></select></div><div id="billList" class="empty">还没有账单</div></div></section>
<section id="stats" class="page"><h2>商品分类统计</h2><div class="card"><label>年份</label><select id="statsYear" onchange="renderStats"></select><div id="statsList" class="empty">暂无数据</div></div></section>
<section id="shops" class="page"><h2>商店账单</h2><div class="card"><h3>山姆</h3><div id="samsSummary"></div><div id="samsList"></div></div><div class="card"><h3>开市客</h3><div id="costcoSummary"></div><div id="costcoList"></div></div></section>
<section id="settings" class="page"><h2>数据与设置</h2><div class="card"><h3>数据备份</h3><button class="primary" onclick="backupJSON()">导出 JSON 备份</button><hr><h3>恢复备份</h3><input type="file" id="restoreFile" accept=".json,application/json"><button class="secondary" onclick="restoreJSON()">恢复 JSON</button><hr><button class="primary" onclick="exportCSV()">导出 CSV（Excel可打开）</button><hr><button class="secondary" onclick="window.print()">打印 / 保存 PDF</button><p class="muted">记录保存在当前浏览器。请定期导出备份；清除浏览器数据可能导致记录丢失。</p></div></section>
</main>
<div id="editModal" class="modal"><div class="modalbox"><h2>编辑小票</h2><div id="editContent"></div><div class="actions"><button class="primary" onclick="updateReceipt()">保存修改</button><button class="secondary" onclick="closeEdit()">取消</button></div></div></div>
<script>
const DB='receiptKeeperDB',TABLE='receipts';
const categories=['肉类','鱼类','海鲜','蔬菜','水果','奶制品','零食','饮料','化妆品','玩具','日用品','清洁用品','粮油调料','面包糕点','冷冻食品','其他'];
let db,receipts=[],currentImage='',editingId=null;
const $=id=>document.getElementById(id);
const money=n=>'£'+Number(n||0).toFixed(2);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openDB(){return new Promise((ok,no)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(TABLE))e.target.result.createObjectStore(TABLE,{keyPath:'id',autoIncrement:true})};q.onsuccess=e=>{db=e.target.result;ok()};q.onerror=()=>no(q.error)})}
function all(){return new Promise((ok,no)=>{let q=db.transaction(TABLE,'readonly').objectStore(TABLE).getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)})}
function put(r){return new Promise((ok,no)=>{let q=db.transaction(TABLE,'readwrite').objectStore(TABLE).put(r);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
function del(id){return new Promise((ok,no)=>{let q=db.transaction(TABLE,'readwrite').objectStore(TABLE).delete(Number(id));q.onsuccess=ok;q.onerror=()=>no(q.error)})}
async function init(){await openDB();receipts=await all();receipts=receipts.map(r=>{if(!Array.isArray(r.products))r.products=(r.items||[]).map(x=>({name:typeof x==='string'?x:(x.name||''),category:'其他',amount:Number(x.amount||0)}));return r});$('receiptDate').value=today();addProductRow();renderAll()}
function showPage(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');renderAll()}
function addProductRow(name='',cat='其他',amount='',target='productList'){let box=document.createElement('div');box.className='product-row';let n=document.createElement('input');n.placeholder='商品名称';n.value=name;n.className='p-name';let c=document.createElement('select');c.className='p-cat';categories.forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;c.append(o)});c.value=categories.includes(cat)?cat:'其他';let a=document.createElement('input');a.type='number';a.step='0.01';a.placeholder='金额';a.value=amount;a.className='p-amount';a.oninput=updateSum;let x=document.createElement('button');x.textContent='×';x.onclick=()=>{box.remove();updateSum(target)};box.append(n,c,a,x);$(target).append(box)}
function readProducts(target='productList'){return [...document.querySelectorAll('#'+target+' .product-row')].map(r=>({name:r.querySelector('.p-name').value.trim(),category:r.querySelector('.p-cat').value,amount:Number(r.querySelector('.p-amount').value||0)})).filter(x=>x.name)}
function updateSum(){let s=readProducts().reduce((a,p)=>a+p.amount,0);if($('sumHint'))$('sumHint').textContent='商品金额合计：'+money(s)}
function resetForm(){currentImage='';$('photoInput').value='';$('preview').style.display='none';$('preview').src='';$('receiptDate').value=today();$('receiptTotal').value='';$('receiptNote').value='';$('productList').innerHTML='';$('ocrStatus').textContent='选择照片后可尝试自动识别。';addProductRow()}
function clearPhoto(){currentImage='';$('photoInput').value='';$('preview').style.display='none';$('preview').src=''}
$('photoInput').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{currentImage=rd.result;$('preview').src=currentImage;$('preview').style.display='block'};rd.readAsDataURL(f)});
async function saveReceipt(){let products=readProducts(),date=$('receiptDate').value,total=$('receiptTotal').value===''?products.reduce((a,p)=>a+p.amount,0):Number($('receiptTotal').value);if(!date)return alert('请选择日期');if(!products.length)return alert('请至少添加一件商品');let sum=products.reduce((a,p)=>a+p.amount,0);if(Math.abs(sum-total)>.02&&!confirm('商品合计 '+money(sum)+' 与小票总额 '+money(total)+' 不一致，仍然保存吗？'))return;let r={store:$('store').value,shop:$('store').value,date,products,amount:total,image:currentImage,note:$('receiptNote').value,created:Date.now()};try{await put(r);receipts=await all();alert('保存成功！');resetForm();showPage('home',document.querySelector('nav button'))}catch(e){alert('保存失败：'+e.message)}}
function card(r){return `<div class="item"><div class="itemtop"><div><b>${escapeHTML(r.store||r.shop||'商店')}</b><div class="muted">${escapeHTML(r.date||'')}</div></div><b class="amount">${money(r.amount)}</b></div><div class="muted">${(r.products||[]).length} 件商品</div><div class="actions"><button class="secondary" onclick="editReceipt(${r.id})">编辑</button><button class="danger" onclick="removeReceipt(${r.id})">删除</button></div></div>`}
function renderAll(){if(!db)return;renderHome();renderBills();renderStats();renderShops();years()}
function renderHome(){let d=today(),now=new Date(),y=now.getFullYear(),m=now.getMonth(),day=0,month=0,year=0;receipts.forEach(r=>{let dt=new Date((r.date||'2000-01-01')+'T00:00:00'),v=Number(r.amount||0);if(r.date===d)day+=v;if(dt.getFullYear()===y&&dt.getMonth()===m)month+=v;if(dt.getFullYear()===y)year+=v});$('todayTotal').textContent=money(day);$('monthTotal').textContent=money(month);$('yearTotal').textContent=money(year);$('receiptCount').textContent=receipts.length;let list=[...receipts].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);$('recentList').innerHTML=list.length?list.map(card).join(''):'<div class="empty">还没有记录</div>'}
function renderBills(){if(!$('billList'))return;let s=$('billStore').value,y=$('billYear').value,l=receipts.filter(r=>(!s||(r.store||r.shop)===s)&&(!y||(r.date||'').startsWith(y))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('billList').innerHTML=l.length?l.map(card).join(''):'<div class="empty">没有账单</div>'}
function years(){let ys=[...new Set(receipts.map(r=>(r.date||'').slice(0,4)).filter(Boolean))].sort().reverse();let b=$('billYear'),old=b.value;b.innerHTML='<option value="">全部年份</option>'+ys.map(y=>`<option>${y}</option>`).join('');b.value=old;let s=$('statsYear'),so=s.value;s.innerHTML='<option value="">全部年份</option>'+ys.map(y=>`<option>${y}</option>`).join('');s.value=so}
function renderStats(){let y=$('statsYear').value,t={};receipts.filter(r=>!y||(r.date||'').startsWith(y)).forEach(r=>(r.products||[]).forEach(p=>t[p.category||'其他']=(t[p.category||'其他']||0)+Number(p.amount||0)));let a=Object.entries(t).sort((x,y)=>y[1]-x[1]);$('statsList').innerHTML=a.length?a.map(([k,v])=>`<div class="item itemtop"><span>${escapeHTML(k)}</span><b>${money(v)}</b></div>`).join(''):'<div class="empty">暂无数据</div>'}
function renderShops(){['山姆','开市客'].forEach(s=>{let l=receipts.filter(r=>(r.store||r.shop)===s).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),t=l.reduce((a,r)=>a+Number(r.amount||0),0),id=s==='山姆'?'sams':'costco';$(id+'Summary').textContent='累计消费 '+money(t)+' · '+l.length+' 张小票';$(id+'List').innerHTML=l.length?l.map(card).join(''):'<div class="empty">暂无记录</div>'})}
async function removeReceipt(id){if(!confirm('确定删除这张小票？'))return;await del(id);receipts=await all();renderAll()}
function editReceipt(id){let r=receipts.find(x=>Number(x.id)===Number(id));if(!r)return;editingId=id;$('editContent').innerHTML=`<label>商店</label><select id="editStore"><option ${r.store==='山姆'?'selected':''}>山姆</option><option ${r.store==='开市客'?'selected':''}>开市客</option></select><label>日期</label><input id="editDate" type="date" value="${escapeHTML(r.date||'')}"><div id="editProducts"></div><button class="secondary" onclick="addProductRow('','其他','','editProducts')">＋ 添加商品</button><label>小票总金额</label><input id="editTotal" type="number" step="0.01" value="${Number(r.amount||0)}"><label>备注</label><textarea id="editNote">${escapeHTML(r.note||'')}</textarea>${r.image?`<img class="receipt-img" src="${r.image}">`:''}`;(r.products||[]).forEach(p=>addProductRow(p.name,p.category,p.amount,'editProducts'));$('editModal').classList.add('show')}
function closeEdit(){$('editModal').classList.remove('show');editingId=null}
async function updateReceipt(){let r=receipts.find(x=>Number(x.id)===Number(editingId));if(!r)return;let p=readProducts('editProducts');if(!p.length)return alert('请至少保留一件商品');let total=Number($('editTotal').value||0),sum=p.reduce((a,x)=>a+x.amount,0);if(Math.abs(sum-total)>.02&&!confirm('商品合计与总金额不同，仍然保存吗？'))return;r.store=$('editStore').value;r.shop=r.store;r.date=$('editDate').value;r.products=p;r.amount=total;r.note=$('editNote').value;await put(r);receipts=await all();closeEdit();renderAll();alert('修改成功')}
function catFor(n){let rules=[['肉类',/牛肉|猪肉|羊肉|鸡肉|鸭肉|排骨|beef|pork|chicken|lamb/],['鱼类',/三文鱼|鳕鱼|鱼柳|金枪鱼|salmon|cod|tuna|fish/],['海鲜',/虾|蟹|龙虾|扇贝|生蚝|鱿鱼|shrimp|prawn|crab/],['蔬菜',/白菜|生菜|西兰花|土豆|番茄|黄瓜|胡萝卜|洋葱|vegetable|broccoli/],['水果',/苹果|香蕉|橙|葡萄|草莓|蓝莓|芒果|apple|banana|orange|grape/],['奶制品',/牛奶|酸奶|奶酪|芝士|黄油|milk|yogurt|cheese|butter/],['零食',/薯片|饼干|巧克力|糖果|坚果|chips|crisps|chocolate|nuts/],['饮料',/饮料|矿泉水|可乐|果汁|咖啡|water|juice|coffee|cola/],['化妆品',/面霜|乳液|口红|粉底|面膜|护肤|cosmetic|makeup/],['玩具',/玩具|积木|娃娃|拼图|lego|toy/],['清洁用品',/洗衣液|洗洁精|清洁剂|detergent|cleaner/],['面包糕点',/面包|蛋糕|吐司|可颂|bread|cake|croissant/],['冷冻食品',/冷冻|冰淇淋|雪糕|frozen|ice cream/],['粮油调料',/大米|食用油|酱油|醋|面粉|rice|oil|flour/],['日用品',/纸巾|牙膏|牙刷|洗发水|沐浴露|toothpaste|shampoo|tissue/]];for(let [c,re] of rules)if(re.test(String(n).toLowerCase()))return c;return '其他'}
function parseReceipt(text){let lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),store=/costco|开市客/i.test(text)?'开市客':'山姆',date=today(),dm=text.match(/(20\d{2})[年./-]\s*(\d{1,2})[月./-]\s*(\d{1,2})/);if(dm)date=dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0');let products=[],skip=/合计|总计|总额|应付|实付|找零|税额|税金|折扣|付款|支付|会员|收银|小计|subtotal|total|change|tax|cash|visa|receipt/i;for(let line of lines){if(skip.test(line))continue;let m=line.match(/(?:£|€|\$)?\s*(\d{1,5}\.\d{2})\s*$/);if(!m)continue;let name=line.slice(0,m.index).replace(/^[\d\s*#]+/,'').trim();if(name.length>=2&&!/^\d+$/.test(name))products.push({name,category:catFor(name),amount:Number(m[1])})}let total=0;for(let line of lines.filter(x=>/合计|总计|总额|应付|实付|grand total|total due/i.test(x))){let a=line.match(/\d{1,5}\.\d{2}/g);if(a)total=Number(a[a.length-1])}if(!total)total=products.reduce((a,p)=>a+p.amount,0);return {store,date,products,total}}
function loadTesseract(){return new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>no(Error('OCR组件加载失败'));document.head.append(s)})}
async function recognizeReceipt(){if(!currentImage)return alert('请先选择照片');$('ocrStatus').textContent='正在加载识别工具……';try{if(typeof Tesseract==='undefined')await loadTesseract();$('ocrStatus').textContent='正在识别，请稍候……';let result=await Tesseract.recognize(currentImage,'chi_sim+eng',{logger:m=>{if(m.status==='recognizing text')$('ocrStatus').textContent='识别中 '+Math.round((m.progress||0)*100)+'%'}});let p=parseReceipt(result.data.text||'');$('store').value=p.store;$('receiptDate').value=p.date;$('productList').innerHTML='';if(p.products.length)p.products.forEach(x=>addProductRow(x.name,x.category,x.amount));else addProductRow();$('receiptTotal').value=p.total||'';updateSum();$('ocrStatus').textContent='识别完成，请仔细核对商品、分类和金额。'}catch(e){console.error(e);$('ocrStatus').textContent='识别失败，请检查网络或手动录入。';alert('识别失败，请检查网络连接。')}}
function download(content,name,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function backupJSON(){download(JSON.stringify({app:'购物小票管家',version:2,receipts},null,2),'购物小票管家备份.json','application/json;charset=utf-8')}
async function restoreJSON(){let f=$('restoreFile').files[0];if(!f)return alert('请先选择JSON文件');if(!confirm('备份记录将导入当前记录，继续吗？'))return;try{let d=JSON.parse(await f.text()),list=Array.isArray(d)?d:d.receipts;if(!Array.isArray(list))throw Error('文件格式不正确');for(let r of list){let x={store:r.store||r.shop||'山姆',shop:r.store||r.shop||'山姆',date:r.date||today(),products:r.products||[],amount:Number(r.amount||0),image:r.image||'',note:r.note||'',created:r.created||Date.now()};await put(x)}receipts=await all();renderAll();alert('恢复完成')}catch(e){alert('恢复失败：'+e.message)}}
function exportCSV(){let rows=[['商店','日期','商品名称','商品分类','商品金额','小票总金额','备注']];receipts.forEach(r=>(r.products||[]).forEach(p=>rows.push([r.store||r.shop,r.date,p.name,p.category,p.amount,r.amount,r.note||''])));let csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(csv,'购物小票明细.csv','text/csv;charset=utf-8')}
$('receiptDate').value=today();init().catch(e=>{console.error(e);alert('数据库初始化失败。请通过正常网页链接打开，并允许浏览器保存网站数据。')});
</script></body></html>
